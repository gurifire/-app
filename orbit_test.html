<body>
<div class="pick" id="pick">
  <h1>실시간 오비트 테스트</h1>
  <p>지원반 앱에 넣기 전, 오비트 화면만 따로 확인하는 페이지입니다. 데이터는 <b>읽기만</b> 하며 Firebase에 아무것도 쓰지 않습니다.</p>
  <button class="main" id="b-real">구리 실제 데이터로 보기<small>gurichecklist · sessions/checklist_live_구리 (읽기 전용)</small></button>
  <button id="b-mock">가상 데이터로 보기<small>Firebase에 연결하지 않고 가상 대원 12명으로 동작 확인</small></button>
  <div class="note">V45_57 실시간 오비트 · 구리소방서 소방교 김대운</div>
</div>
<div id="screen-orbit"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* V45_57: 실시간 오비트 (읽기 전용)
   - 관서별 Firebase의 sessions/{세션}/members, disasterStatus 를 읽기만 함 (쓰기 코드 없음)
   - 앱의 Firebase 연결(FB.db)을 같이 사용 → 동시접속 수 증가 없음
   - 화면을 떠나면 오비트가 붙인 리스너만 해제 (앱 기존 리스너는 건드리지 않음)
   - 구형 안드로이드 대응: ES5 문법만 사용
*/
(function(){
  if(window.GuriOrbit) return;

  var VERSION = 'V45_57';
  var C = 300, R_NODE = 206, R_LABEL = 228, R_SECT = 126, R_CORE = 60, R_DIAL = 286;
  var STALE_MIN = 20;
  var NS = 'http://www.w3.org/2000/svg';

  var GROUPS = [
    { id:'chief',   name:'지원반장',       roles:['chief'], color:'#D4A017' },
    { id:'support', name:'긴급지원반',     roles:['cmd','res','com','safe','invest','decon','ems'], color:'#7AA2D6' },
    { id:'control', name:'긴급구조통제단', roles:['controlPlan','controlField','controlResource'], color:'#A08BD6' },
    { id:'etc',     name:'역할 선택 전',   roles:[], color:'#5FC0C8' }
  ];
  var ROLE_NAMES = { chief:'지원반장', cmd:'현장지휘요원', res:'자원지원요원', com:'통신지원요원', safe:'안전관리요원',
    invest:'상황조사요원', decon:'오염통제요원', ems:'구급지휘요원', controlPlan:'대응계획부', controlField:'현장지휘부',
    controlResource:'자원지원부', none:'현장 출동 전 종료', depart:'출동단계', earlyEnd:'현장 출동 전 종료' };
  var ROLE_SHORT = { chief:'반장', cmd:'현장지휘', res:'자원지원', com:'통신지원', safe:'안전관리', invest:'상황조사',
    decon:'오염통제', ems:'구급지휘', controlPlan:'대응계획', controlField:'현장지휘부', controlResource:'자원지원부' };
  var ST = {
    idle: { name:'체크 전', fill:'#16213A', stroke:'#7D89A3', label:'#97A3BC' },
    work: { name:'진행 중', fill:'#3FB97A', stroke:'#0B1220', label:'#E8EDF7' },
    full: { name:'항목 완료', fill:'#4FA3E0', stroke:'#0B1220', label:'#E8EDF7' },
    end:  { name:'활동 종료', fill:'#3A4560', stroke:'#7D89A3', label:'#7D89A3' }
  };

  var S = null; // 화면 상태

  /* ===== 도우미 ===== */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ n = String(n); return n.length < 2 ? '0' + n : n; }
  function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dash(v){ return (v == null || v === '' || v === '-') ? '' : String(v); }
  function f1(n){ return (Math.round(n * 10) / 10).toString(); }
  function pos(r, deg){ var a = deg * Math.PI / 180; return [C + r * Math.sin(a), C - r * Math.cos(a)]; }
  function arc(r, a0, a1){
    var p0 = pos(r, a0), p1 = pos(r, a1);
    return 'M' + f1(p0[0]) + ' ' + f1(p0[1]) + 'A' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + f1(p1[0]) + ' ' + f1(p1[1]);
  }
  function upTo(el, attr, stop){
    while(el && el !== stop){ if(el.getAttribute && el.getAttribute(attr) != null) return el; el = el.parentNode; }
    return null;
  }
  function groupOf(role){
    for(var i = 0; i < GROUPS.length; i++){ if(GROUPS[i].roles.indexOf(role) >= 0) return GROUPS[i]; }
    return GROUPS[3];
  }
  function minutesAgo(iso){ var t = Date.parse(iso || ''); if(isNaN(t)) return null; return Math.max(0, Math.floor((Date.now() - t) / 60000)); }
  function agoText(m){ if(m == null) return '-'; if(m < 1) return '방금'; if(m < 60) return m + '분 전'; return Math.floor(m / 60) + '시간 ' + (m % 60) + '분 전'; }

  /* ===== 데이터 정리 ===== */
  function isValid(rec, key){
    if(!rec || rec.registrationSaved !== true) return false;
    var m = rec.member || {};
    if(!m.name || !String(m.name).replace(/\s/g, '')) return false;
    if(String(key || '').indexOf('미입력_') === 0) return false;
    return true;
  }
  function normalize(raw){
    var list = [];
    Object.keys(raw || {}).forEach(function(key){
      var r = raw[key];
      if(!isValid(r, key)) return;
      var m = r.member || {};
      var done = Number(r.done || 0), total = Number(r.total || 0);
      var pct = typeof r.percent === 'number' ? r.percent : (total ? Math.round(done / total * 100) : 0);
      var role = r.currentRole || '';
      var st = 'idle';
      if(r.activityEndTime || r.earlyEndTime || role === 'none') st = 'end';
      else if(total > 0 && done >= total) st = 'full';
      else if(done > 0) st = 'work';
      var mt = r.mobilizeTime || {};
      list.push({ key:key, unit:m.unit || '', rank:m.rank || '', name:String(m.name).replace(/^\s+|\s+$/g, ''),
        role:role, roleName:ROLE_NAMES[role] || '역할 선택 전', group:groupOf(role), done:done, total:total, pct:pct, st:st,
        mobEss:mt.essential || '', mobGen:mt.general || '', endTime:r.activityEndTime || r.earlyEndTime || '',
        updatedAt:r.updatedAt || '', summary:r.roleSummary || {} });
    });
    list.sort(function(a, b){
      var ga = GROUPS.indexOf(a.group), gb = GROUPS.indexOf(b.group);
      if(ga !== gb) return ga - gb;
      if(a.role !== b.role) return a.role < b.role ? -1 : 1;

    });

  }

  /* ===== 변화 기록 (화면을 연 뒤부터, 이 기기에서만) ===== */
  function diff(prev, next){
    var out = [], pm = {}, nm = {};
    prev.forEach(function(p){ pm[p.key] = p; });
    next.forEach(function(n){
      nm[n.key] = n;
      var p = pm[n.key], who = n.rank + ' ' + n.name;
      if(!p){ out.push({ key:n.key, kind:'join', text:'<b>' + esc(who) + '</b> 현황에 합류 · ' + esc(n.roleName) }); return; }
      if(p.role !== n.role) out.push({ key:n.key, kind:'role', text:'<b>' + esc(who) + '</b> 역할 → ' + esc(n.roleName) });
      if(n.done > p.done) out.push({ key:n.key, kind:'up', text:'<b>' + esc(who) + '</b> ' + esc(ROLE_SHORT[n.role] || n.roleName) + ' 진행 ' + p.pct + '% → ' + n.pct + '%' });
      if(p.st !== 'end' && n.st === 'end') out.push({ key:n.key, kind:'end', text:'<b>' + esc(who) + '</b> 활동 종료' + (n.endTime ? ' (' + esc(n.endTime) + ')' : '') });
      if(p.st !== 'full' && n.st === 'full') out.push({ key:n.key, kind:'full', text:'<b>' + esc(who) + '</b> 체크 항목 모두 완료' });
    });
    prev.forEach(function(p){ if(!nm[p.key]) out.push({ key:null, kind:'leave', text:'<b>' + esc(p.rank + ' ' + p.name) + '</b> 현황에서 빠짐' }); });
    return out;
  }

  /* ===== 궤도 그리기 ===== */
  function layout(list){
    var counts = {}, weights = [], totalW = 0, GAP = 8;
    GROUPS.forEach(function(g){ counts[g.id] = 0; });
    list.forEach(function(m){ counts[m.group.id]++; });
    GROUPS.forEach(function(g, i){
      var w = Math.max(counts[g.id], g.id === 'etc' ? 0.8 : 1.4);
      weights[i] = w; totalW += w;
    });
    var avail = 360 - GAP * GROUPS.length, a = GAP / 2, sect = [];
    GROUPS.forEach(function(g, i){
      var span = avail * weights[i] / totalW;
      sect.push({ g:g, start:a, end:a + span, count:counts[g.id] });
      var mem = list.filter(function(m){ return m.group === g; });
      var step = span / Math.max(mem.length, 1);
      mem.forEach(function(m, j){ m.angle = a + step * (j + 0.5); });
      a += span + GAP;
    });
    return sect;
  }

      if(late) nd += '<circle cx="' + f1(p[0] + 9) + '" cy="' + f1(p[1] - 9) + '" r="4.5" fill="#F2A33A" stroke="#0B1220" stroke-width="1.5"/>';
      nd += '</g>';
    });
    $('go-sects').innerHTML = h; $('go-spokes').innerHTML = sp; $('go-nodes').innerHTML = nd;
    var tot = totals();
    $('go-dial').setAttribute('d', tot.pct > 0 ? arc(R_DIAL, 0, Math.min(tot.pct * 3.6, 359.9)) : '');
    $('go-core1').textContent = S.stationShort;

    $('go-core2').textContent = lvl ? (lvl.length > 11 ? lvl.slice(0, 11) + '…' : lvl) : '대응단계 미입력';
    $('go-core3').textContent = '활동 ' + list.length + '명 · ' + tot.pct + '%';

  function ringArc(c, r, pct){
    var a1 = Math.min(pct, 99.9) * 3.6, rad0 = 0, rad1 = a1 * Math.PI / 180;

    return 'M' + f1(x0) + ' ' + f1(y0) + 'A' + r + ' ' + r + ' 0 ' + (a1 > 180 ? 1 : 0) + ' 1 ' + f1(x1) + ' ' + f1(y1);
  }
  function totals(){
    var d = 0, t = 0; S.list.forEach(function(m){ d += m.done; t += m.total; });

  /* 변화가 있을 때 노드 → 중앙으로 움직이는 점 */
  function fly(key, kind){
    var m = null; S.list.forEach(function(x){ if(x.key === key) m = x; });
    if(!m || m.angle == null) return;
    var color = kind === 'end' ? '#7D89A3' : (kind === 'full' ? '#4FA3E0' : (kind === 'join' ? '#5FC0C8' : '#3FB97A'));
    var a = pos(R_NODE, m.angle), b = [C, C];
    var g = $('go-pk'); if(!g) return;
    var line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', f1(a[0])); line.setAttribute('y1', f1(a[1])); line.setAttribute('x2', C); line.setAttribute('y2', C);
    line.setAttribute('stroke', color); line.setAttribute('stroke-width', '1.4'); line.setAttribute('opacity', '.5');
    var dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', '5'); dot.setAttribute('fill', color);
    g.appendChild(line); g.appendChild(dot);
    var t0 = Date.now(), dur = 1100;
    (function step(){
      if(!S) return;
      var t = (Date.now() - t0) / dur;
      if(t >= 1){ try{ g.removeChild(dot); g.removeChild(line); }catch(e){} return; }
      var e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      dot.setAttribute('cx', f1(a[0] + (b[0] - a[0]) * e)); dot.setAttribute('cy', f1(a[1] + (b[1] - a[1]) * e));
      line.setAttribute('opacity', f1(.5 * (1 - t)));
      (window.requestAnimationFrame || function(fn){ return setTimeout(fn, 16); })(step);
    })();
  }

  /* ===== 입력 (구형 기기 touchend 폴백 포함) ===== */
  function bindTap(root, fn){

    root.addEventListener('touchstart', function(){ moved = false; }, { passive:true });
    root.addEventListener('touchmove', function(){ moved = true; }, { passive:true });
    root.addEventListener('touchend', function(e){
      if(moved) return;
      var t = upTo(e.target, 'data-go', root) || upTo(e.target, 'data-key', root);
      if(!t) return;
      touched = Date.now(); e.preventDefault(); fn(t);
    });
    root.addEventListener('click', function(e){
      if(Date.now() - touched < 600) return;
      var t = upTo(e.target, 'data-go', root) || upTo(e.target, 'data-key', root);
      if(t) fn(t);
    });
    root.addEventListener('keydown', function(e){
      if(e.keyCode !== 13 && e.keyCode !== 32) return;
      var t = upTo(e.target, 'data-key', root); if(t && t.tagName.toLowerCase() === 'g'){ e.preventDefault(); fn(t); }
    });
  }
  function onTap(t){
    var go = t.getAttribute('data-go');
    if(go === 'back'){ closeSheet(true); if(S && S.opts.onBack) S.opts.onBack(); return; }
    if(go === 'close'){ closeSheet(); return; }
    if(go === 'retry'){ if(S){ var o = S.opts; unmount(); mount(o); } return; }
    var key = t.getAttribute('data-key'); if(key) openSheet(key);
  }

  /* ===== 데이터 수신 ===== */
  function onMembers(raw){
    if(!S) return;
    var next = normalize(raw), first = !S.gotMembers;
    S.gotMembers = true;
    var changes = first ? [] : diff(S.list, next);
    S.list = next;
    var now = hm(new Date());
    if(first) S.log.push({ t:now, text:'현황 수신 · 활동 인원 ' + next.length + '명' });
    changes.forEach(function(c){ S.log.push({ t:now, text:c.text }); });
    if(S.log.length > 200) S.log.splice(0, S.log.length - 200);
    render();
    changes.forEach(function(c){ if(c.key) fly(c.key, c.kind); });
    if(S.sel){ var still = false; next.forEach(function(m){ if(m.key === S.sel) still = true; }); if(still && document.getElementById('go-layer')) openSheet(S.sel); else if(!still) closeSheet(); }
  }
  function onDisaster(d){
    if(!S) return;
    S.ds = d || {};
    if(S.gotMembers) render(); else drawStage();
  }
  function onError(err){
    if(!S) return;
    var msg = '권한이 없거나 연결이 끊겼습니다. 잠시 후 다시 시도하세요.';
    try{ if(err && String(err.code || err.message || '').indexOf('permission') >= 0) msg = '이 관서 데이터를 읽을 권한이 없습니다. 관리자에게 문의하세요.'; }catch(e){}
    overlay('error', msg);
  }
  function render(){
    drawStage(); drawOrbit(); drawPanels();
    overlay(S.list.length ? null : 'empty');
  }
  function syncOnline(){ var o = $('go-offline'); if(o) o.className = 'go-offline' + (navigator.onLine === false ? ' show' : ''); }

  /* ===== 공개 함수 ===== */
  function mount(opts){
    unmount();
    var root = opts.root;
    root.innerHTML = shell();
    S = { opts:opts, list:[], ds:{}, log:[], sel:null, gotMembers:false, unsub:[], stationShort:opts.stationShort || '관서' };
    $('go-ttl').textContent = (opts.stationName || '관서') + ' 오비트';
    drawBase(); legend(); drawStage(); overlay('loading');
    if(!root.__goBound){ bindTap(root, onTap); root.__goBound = true; }
    syncOnline();
    S.onl = syncOnline; window.addEventListener('online', syncOnline); window.addEventListener('offline', syncOnline);
    S.tick = setInterval(function(){ if(S && S.gotMembers){ drawOrbit(); drawPanels(); } }, 30000);
    var src = opts.source;
    if(!src){ overlay('error', 'Firebase 연결 전입니다. 관서를 선택한 뒤 다시 열어주세요.'); setConn('off', '연결 안 됨'); return; }
    try{
      S.unsub.push(src.members(onMembers, onError));
      S.unsub.push(src.disaster(onDisaster, function(){}));
      if(src.connected) S.unsub.push(src.connected(function(on){ setConn(on ? 'on' : 'off', on ? '실시간 연결' : '연결 끊김'); }));
      else setConn('on', '실시간 연결');
    }catch(e){ onError(e); }
  }
  function setConn(cls, txt){ var el = $('go-conn'); if(el){ el.className = 'go-conn ' + cls; el.textContent = txt; } }
  function unmount(){
    if(!S) return;
    S.unsub.forEach(function(fn){ try{ fn(); }catch(e){} });
    clearInterval(S.tick);
    window.removeEventListener('online', S.onl); window.removeEventListener('offline', S.onl);
    closeSheet(true);
    S = null;
  }
  /* Firebase(compat) 읽기 전용 소스 — 리스너는 오비트가 붙인 콜백만 해제 */
  function firebaseSource(db, sessionId){
    function listen(path, cb, err){
      var ref = db.ref(path), h = function(s){ cb(s.val()); };
      ref.on('value', h, err);
      return function(){ ref.off('value', h); };
    }
    return {
      members: function(cb, err){ return listen('sessions/' + sessionId + '/members', function(v){ cb(v || {}); }, err); },
      disaster: function(cb, err){ return listen('sessions/' + sessionId + '/disasterStatus', function(v){ cb(v || {}); }, err); },
      connected: function(cb){ return listen('.info/connected', function(v){ cb(v === true); }, function(){}); }
    };
  }

  window.GuriOrbit = { mount:mount, unmount:unmount, firebaseSource:firebaseSource, isMounted:function(){ return !!S; }, version:VERSION };
})();
</script>
<script>
/* 테스트 페이지 전용: 가상 데이터 소스 (Firebase에 연결하지 않음) */
(function(){
  var NAMES = ['홍길동','김소방','이구조','박진압','최구급','정통신','강안전','조상황','윤오염','장자원','임지휘','한대응'];
  var ROLES = ['chief','cmd','res','com','safe','invest','decon','ems','controlPlan','controlField','controlResource',''];
  var RN = {chief:'지원반장 확인 목록',cmd:'현장지휘요원',res:'자원지원요원',com:'통신지원요원',safe:'안전관리요원',invest:'상황조사요원',decon:'오염통제요원',ems:'구급지휘요원',controlPlan:'대응계획부',controlField:'현장지휘부',controlResource:'자원지원부'};
  var RANKS = ['소방령','소방경','소방위','소방장','소방교','소방사'];
  function iso(minAgo){ return new Date(Date.now() - minAgo * 60000).toISOString(); }
  function build(){
    var m = {};
    NAMES.forEach(function(n, i){
      var role = ROLES[i], total = role ? 18 + (i % 4) * 4 : 0, done = role ? Math.floor(Math.random() * total * 0.6) : 0;
      if(i === 4) done = total;
      var key = 'dev_demo' + i + '_재난대응과_' + RANKS[i % 6] + '_' + n;
      var sum = {}; if(role) sum[role] = { name:RN[role], done:done, total:total };
      m[key] = { member:{unit:'재난대응과', rank:RANKS[i % 6], name:n}, registrationSaved:true, currentRole:role,
        mobilizeTime:{essential:'14:0' + (i % 10), general:null}, earlyEndTime:null, activityEndTime: i === 7 ? '15:10' : null,
        roleChecked:{}, departChecked:[], roleSummary:sum, done:done, total:total, percent: total ? Math.round(done / total * 100) : 0,
        updatedAt: iso(i === 2 ? 26 : (i % 5)) };
    });
    return m;
  }
  window.GuriOrbitMock = function(){
    var data = build(), ds = { overviewDateTime:'2026. 11. 12. 14:00', overviewLocation:'○○동 ○○물류창고 (가상)', overviewResponseLevel:'대응1단계(14:12)',
      rescueRequired:'3명', rescueDone:'2명', rescueTransport:'병원 이송 1명', resourcePersonnel:'48명', resourceVehicles:'14대' };
    var mcb = null, timer = null;
    function tick(){
      var keys = Object.keys(data), k = keys[Math.floor(Math.random() * keys.length)], r = data[k];
      if(r.activityEndTime || !r.total || r.done >= r.total) return;
      r.done = Math.min(r.total, r.done + 1 + Math.floor(Math.random() * 3));
      r.percent = Math.round(r.done / r.total * 100);
      r.roleSummary[r.currentRole].done = r.done; r.updatedAt = new Date().toISOString();
      if(mcb) mcb(JSON.parse(JSON.stringify(data)));
    }
    return {
      members: function(cb){ mcb = cb; setTimeout(function(){ cb(JSON.parse(JSON.stringify(data))); }, 500); timer = setInterval(tick, 2500); return function(){ clearInterval(timer); mcb = null; }; },
      disaster: function(cb){ setTimeout(function(){ cb(ds); }, 300); return function(){}; },
      connected: function(cb){ cb(true); return function(){}; }
    };
  };
})();
</script>
